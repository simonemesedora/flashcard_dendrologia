<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dendrológia</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    padding: 20px;
    color: #333;
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 24px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 24px;
    margin: 20px 0;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
}

.name-container {
    text-align: center;
    margin: 10px 0 22px 0;
    transition: opacity .3s, transform .3s;
}

.name-container.emoji-only .names {
    display: none;
}

.name-container.names-only .emoji {
    display: none;
}

.emoji {
    font-size: 52px;
    cursor: pointer;
    transition: transform .2s, opacity .3s;
}

.emoji:hover {
    transform: scale(1.08);
}

.names {
    font-size: 24px;
    transition: opacity .3s;
}

.latin-name {
    font-weight: bold;
    color: #222;
    margin: 5px 0;
    font-size: 28px;
}

.magyar-name {
    font-size: 19px;
    color: #667eea;
    font-style: italic;
    margin: 5px 0;
}

#progress {
    text-align: center;
    color: white;
    font-size: 18px;
    font-weight: bold;
    margin: 10px 0 14px 0;
}

#flashButtons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: #11998e;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: background .2s, transform .15s;
}

button:hover {
    background: #0f8b7e;
    transform: translateY(-1px);
}

.reveal-btn {
    background: #28a745 !important;
}

.list-btn {
    background: #17a2b8 !important;
}

.back-btn {
    background: #6c757d !important;
    margin-bottom: 12px;
}

.hidden {
    display: none !important;
}

.clickable {
    cursor: pointer;
}

#listView {
    display: none;
}

#images {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    align-items: stretch;
}

.flash-img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
    cursor: pointer;
    display: block;
    transition: transform .18s ease, box-shadow .18s ease;
    background: #f3f3f3;
}

.flash-img:hover {
    transform: scale(1.01);
    box-shadow: 0 8px 18px rgba(0,0,0,.22);
}

#listView .collapsible {
    background: #f1f1f1;
    color: #333;
    cursor: pointer;
    padding: 18px;
    width: 100%;
    border: none;
    text-align: left;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    margin-bottom: 6px;
    transition: background .25s;
}

#listView .collapsible:hover {
    background: #ddd;
    color: #000;
}

#listView .plant-content {
    display: none;
    padding: 0 4px 10px 4px;
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease-out;
}

#listView .plant-content.show {
    display: block;
    max-height: 3000px;
}

#listView .photo-links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    padding: 12px 0 16px 0;
}

#listView .photo-links img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
}

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px 70px;
}

.lightbox.show {
    display: flex;
}

.lightbox-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.lightbox-img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    object-fit: contain;
}

.lightbox-btn,
.lightbox-close {
    position: absolute;
    border: none;
    color: white;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(4px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
}

.lightbox-btn {
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 28px;
}

.lightbox-btn:hover,
.lightbox-close:hover {
    background: rgba(255,255,255,0.24);
}

.lightbox-prev {
    left: 10px;
}

.lightbox-next {
    right: 10px;
}

.lightbox-close {
    top: 10px;
    right: 10px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 28px;
    line-height: 1;
}

.lightbox-caption {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 12px;
    color: white;
    text-align: center;
    background: rgba(0,0,0,.45);
    padding: 10px 14px;
    border-radius: 10px;
    max-width: min(92vw, 900px);
    font-size: 15px;
}

.lightbox-counter {
    display: block;
    opacity: .85;
    margin-top: 4px;
    font-size: 13px;
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 16px;
        border-radius: 14px;
    }

    .latin-name {
        font-size: 24px;
    }

    .magyar-name {
        font-size: 17px;
    }

    #images {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .flash-img {
        width: 100%;
        height: min(42vh, 340px);
        max-height: 340px;
        border-radius: 12px;
    }

    #listView .photo-links {
        grid-template-columns: 1fr 1fr;
    }

    #listView .photo-links img {
        height: 140px;
    }

    .lightbox {
        padding: 16px 10px 70px 10px;
    }

    .lightbox-btn {
        width: 46px;
        height: 46px;
        font-size: 24px;
        top: auto;
        bottom: 10px;
        transform: none;
    }

    .lightbox-prev {
        left: calc(50% - 60px);
    }

    .lightbox-next {
        right: calc(50% - 60px);
    }

    .lightbox-close {
        top: 8px;
        right: 8px;
        width: 44px;
        height: 44px;
        font-size: 26px;
    }

    .lightbox-caption {
        bottom: 62px;
        width: calc(100% - 20px);
        font-size: 14px;
    }
}

@media (max-width: 480px) {
    .flash-img {
        height: min(46vh, 360px);
    }

    #listView .photo-links {
        grid-template-columns: 1fr;
    }

    #listView .photo-links img {
        height: 180px;
    }
}
</style>
</head>
<body>
<div class="container">
    <h1>🌳 Dendrológia - 63 növény</h1>

    <div id="progress">1 / 63</div>

    <div id="flashButtons">
        <button onclick="prev()">⬅️ Előző</button>
        <button id="revealBtn" onclick="revealToggle()">🔍 Név mutatása</button>
        <button onclick="next()">Következő ➡️</button>
        <button onclick="shuffle()">🎲 Kever</button>
        <button id="listBtn" class="list-btn" onclick="showList()">📋 Lista</button>
    </div>

    <div id="card" class="card">
        <div class="name-container emoji-only" id="nameContainer">
            <div class="emoji" onclick="revealToggle()">🌳</div>
            <div class="names clickable" id="names" onclick="revealToggle()">
                <div class="latin-name" id="latin"></div>
                <div class="magyar-name" id="magyar"></div>
            </div>
        </div>
        <div id="images"></div>
    </div>

    <div id="listView" class="card">
        <button class="back-btn" onclick="showFlashcard()">← Vissza a kártyákhoz</button>
        <h2>📋 Növény lista</h2>
        <div id="plantList"></div>
    </div>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-content">
        <button class="lightbox-close" onclick="closeLightbox()" aria-label="Bezárás">×</button>
        <button class="lightbox-btn lightbox-prev" onclick="prevLightbox()" aria-label="Előző kép">❮</button>
        <img id="lightboxImg" class="lightbox-img" src="" alt="">
        <button class="lightbox-btn lightbox-next" onclick="nextLightbox()" aria-label="Következő kép">❯</button>
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
</div>

function imagePath(filename) {
    return `dendrologia_kepek/${filename}`;
}

function showFlashcard() {
    view = 'flashcard';
    document.getElementById('flashButtons').classList.remove('hidden');
    document.getElementById('card').style.display = 'block';
    document.getElementById('listView').style.display = 'none';
    showCard();
}

function showList() {
    view = 'list';
    document.getElementById('flashButtons').classList.add('hidden');
    document.getElementById('card').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    renderPlantList();
}

function renderPlantList() {
    let html = '';
    plants.forEach((p, i) => {
        html += `
            <button class="collapsible" onclick="toggleCollapsible(this)">
                ${p.latin} - ${p.magyar}
            </button>
            <div class="plant-content">
                <div class="photo-links">
                    ${p.images.map((img, imgIndex) => `
                        <img
                            src="${imagePath(img)}"
                            alt="${p.latin}"
                            onclick="openLightboxByPlant(${i}, ${imgIndex})"
                            loading="lazy"
                        >
                    `).join('')}
                </div>
            </div>
        `;
    });
    document.getElementById('plantList').innerHTML = html;
}

function toggleCollapsible(button) {
    const content = button.nextElementSibling;
    content.classList.toggle('show');
}

function showCard() {
    const p = plants[idx];
    document.getElementById('latin').textContent = p.latin;
    document.getElementById('magyar').textContent = p.magyar;

    const imgs = p.images.map((img, imgIndex) => `
        <img
            class="flash-img"
            src="${imagePath(img)}"
            alt="${p.latin}"
            onclick="openLightboxByPlant(${idx}, ${imgIndex})"
            loading="lazy"
        >
    `).join('');

    document.getElementById('images').innerHTML = imgs || '<p>Nincs kép ehhez a növényhez.</p>';
    document.getElementById('progress').textContent = `${idx + 1} / ${plants.length}`;

    isRevealed = false;
    updateCardState();
}

function revealToggle() {
    isRevealed = !isRevealed;
    updateCardState();
}

function updateCardState() {
    const container = document.getElementById('nameContainer');
    const revealBtn = document.getElementById('revealBtn');
    const emoji = container.querySelector('.emoji');
    const names = container.querySelector('.names');

    if (isRevealed) {
        container.className = 'name-container names-only';
        names.style.display = 'block';
        emoji.style.display = 'none';
        revealBtn.innerHTML = '🙈 Név elrejtése';
        revealBtn.classList.add('reveal-btn');
    } else {
        container.className = 'name-container emoji-only';
        names.style.display = 'none';
        emoji.style.display = 'block';
        revealBtn.innerHTML = '🔍 Név mutatása';
        revealBtn.classList.remove('reveal-btn');
    }
}

function next() {
    idx = (idx + 1) % plants.length;
    showCard();
}

function prev() {
    idx = (idx - 1 + plants.length) % plants.length;
    showCard();
}

function shuffle() {
    for (let i = plants.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [plants[i], plants[j]] = [plants[j], plants[i]];
    }
    idx = 0;
    showCard();
}

function openLightboxByPlant(plantIndex, imageIndex) {
    const p = plants[plantIndex];
    lightboxImages = p.images.map(img => imagePath(img));
    lightboxIndex = imageIndex;
    lightboxTitle = `${p.latin} — ${p.magyar}`;
    renderLightbox();
    document.getElementById('lightbox').classList.add('show');
    document.getElementById('lightbox').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
}

function renderLightbox() {
    const imgEl = document.getElementById('lightboxImg');
    const captionEl = document.getElementById('lightboxCaption');

    imgEl.src = lightboxImages[lightboxIndex];
    imgEl.alt = lightboxTitle;

    captionEl.innerHTML = `
        <div>${lightboxTitle}</div>
        <span class="lightbox-counter">${lightboxIndex + 1} / ${lightboxImages.length}</span>
    `;
}

function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
    document.getElementById('lightbox').setAttribute('aria-hidden', 'true');
    document.getElementById('lightboxImg').src = '';
    document.body.style.overflow = '';
}

function nextLightbox() {
    if (!lightboxImages.length) return;
    lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
    renderLightbox();
}

function prevLightbox() {
    if (!lightboxImages.length) return;
    lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
    renderLightbox();
}

document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target.id === 'lightbox') {
        closeLightbox();
    }
});

document.addEventListener('keydown', function(e) {
    const lightboxOpen = document.getElementById('lightbox').classList.contains('show');

    if (lightboxOpen) {
        if (e.key === 'Escape') {
            closeLightbox();
        } else if (e.key === 'ArrowRight') {
            nextLightbox();
        } else if (e.key === 'ArrowLeft') {
            prevLightbox();
        }
        return;
    }

    if (view !== 'flashcard') return;

    if (e.key === 'ArrowRight') {
        next();
    } else if (e.key === 'ArrowLeft') {
        prev();
    } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        revealToggle();
    }
});

showFlashcard();
</script>
</body>
</html>
